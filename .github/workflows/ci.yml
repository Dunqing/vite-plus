name: PR 3009 standalone trampoline comparison
run-name: PR 3009 / ${{ inputs.nonce }}
'on':
  workflow_dispatch:
    inputs:
      nonce:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: pr-3009-standalone-r1
  cancel-in-progress: false
jobs:
  cold:
    name: cold / ${{ matrix.platform }} / ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: &id001
        - platform: linux
          os: namespace-profile-linux-x64-default
          variant: before
        - platform: linux
          os: namespace-profile-linux-x64-default
          variant: after
        - platform: macos
          os: namespace-profile-mac-default
          variant: before
        - platform: macos
          os: namespace-profile-mac-default
          variant: after
    env:
      BENCH_VARIANT: ${{ matrix.variant }}
    steps:
    - &id002
      uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
    - &id003
      uses: ./.github/actions/clone
    - name: Record source and runner
      run: python3 .github/benchmark/trampoline-3009/measure.py initial
    - name: Set up Rust and Cargo cache
      id: rust
      uses: ./.github/benchmark/trampoline-3009/setup-rust
      with:
        tools: just
        cache-key: ${{ format('bench-pr3009-{0}-{1}-{2}', inputs.nonce, matrix.platform, matrix.variant) }}
        save-cache: 'true'
    - name: Measure cold trampoline command
      run: python3 .github/benchmark/trampoline-3009/measure.py cold
      env:
        BENCH_CACHE_HIT: ${{ steps.rust.outputs.cache-hit }}
    - name: Upload measurements
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: trampoline-${{ matrix.platform }}-${{ matrix.variant }}-cold
        path: ${{ runner.temp }}/trampoline-3009-results/
        retention-days: 14
        if-no-files-found: error
  warm:
    name: warm / ${{ matrix.platform }} / ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: *id001
    env:
      BENCH_VARIANT: ${{ matrix.variant }}
    steps:
    - *id002
    - *id003
    - name: Record source and runner
      run: python3 .github/benchmark/trampoline-3009/measure.py initial
    - name: Set up Rust and Cargo cache
      id: rust
      uses: ./.github/benchmark/trampoline-3009/setup-rust
      with:
        tools: just
        cache-key: ${{ format('bench-pr3009-{0}-{1}-{2}', inputs.nonce, matrix.platform, matrix.variant) }}
        save-cache: 'false'
    - name: Measure warm trampoline command
      run: python3 .github/benchmark/trampoline-3009/measure.py warm
      env:
        BENCH_CACHE_HIT: ${{ steps.rust.outputs.cache-hit }}
    - name: Upload measurements
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: trampoline-${{ matrix.platform }}-${{ matrix.variant }}-warm
        path: ${{ runner.temp }}/trampoline-3009-results/
        retention-days: 14
        if-no-files-found: error
    needs: cold
  musl:
    name: Alpine musl / cold paired
    runs-on: namespace-profile-linux-x64-default
    timeout-minutes: 25
    container:
      image: node:25-alpine3.21
    env:
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      RUSTFLAGS: --cfg tokio_unstable -C link-args=-Wl,--warn-unresolved-symbols -C target-feature=-crt-static
    steps:
    - name: Install Alpine dependencies
      shell: sh {0}
      run: apk add --no-cache bash curl git just musl-dev gcc g++ python3 cmake make util-linux
    - *id002
    - uses: ./.github/actions/clone
      with:
        setup-node: 'false'
    - name: Install rustup
      run: 'export HOME=/root

        curl --proto ''=https'' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none

        echo "/root/.cargo/bin" >> "$GITHUB_PATH"'
    - name: Install Rust toolchain
      run: rustup show
    - name: Record source and runner
      run: python3 .github/benchmark/trampoline-3009/measure.py initial
    - name: Measure alternating cold trampoline commands
      run: python3 .github/benchmark/trampoline-3009/measure.py musl
    - name: Upload measurements
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: trampoline-musl-cold
        path: ${{ runner.temp }}/trampoline-3009-results/
        retention-days: 14
        if-no-files-found: error
