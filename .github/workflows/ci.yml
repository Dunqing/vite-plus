name: PR 2987 migration comparison
run-name: PR 2987 only / migration performance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-2987-isolated-migration-r2
  cancel-in-progress: false
jobs:
  migration:
    name: Compare migration source on Linux
    runs-on: namespace-profile-linux-x64-default
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RAYON_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/clone
      - uses: oxc-project/setup-rust@68c3199c5339f965e6e163924c3c450773eba42b
        with:
          restore-cache: false
          save-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: langgenius/dify
          ref: baf2191ee360c5f058a9e25c2c2c26cafea2bbe6
          path: .benchmark-fixtures/dify
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cloudflare/vinext
          ref: 2a2ce31ecc286ae38ab1f0bce13d94418da8a513
          path: .benchmark-fixtures/vinext
          persist-credentials: false
      - name: Test migration crate at rebased PR head
        run: cargo test --locked -p vp_migration --lib
      - name: Build identical release drivers with main and PR implementations
        run: python3 .github/benchmark/migration-2987/build.py
      - name: Measure six alternating pairs and collect separate parse diagnostics
        run: python3 .github/benchmark/migration-2987/run.py
      - name: Upload raw measurements and build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-2987-migration-results
          path: |
            ${{ runner.temp }}/pr-2987/*.json
            ${{ runner.temp }}/pr-2987/*.md
            ${{ runner.temp }}/pr-2987/*.log
          if-no-files-found: warn
          retention-days: 14
