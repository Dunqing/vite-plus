name: Vinext test scheduling benchmark
'on':
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: vinext-scheduling-benchmark
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  baseline:
    name: Vinext baseline (${{ matrix.group }})
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TEST_PATTERN: ${{ matrix.pattern }}
    permissions:
      contents: read
      packages: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.project.timeout || 10 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: baseline
            pattern: ''
            os: ubuntu-latest
            project: &id001
              name: vinext
              node-version: 24
              timeout: 20
              command: |
                # vp migrate's auto-install passes --ignore-scripts on pnpm v11
                # (vinext pins pnpm 11), which skips vinext's approved
                # better-sqlite3 build, and the follow-up `vp install` never
                # re-runs it. Rebuild it so the better-auth fixture works.
                vp rebuild -- -r better-sqlite3
                vp run build
                vp check --fix
                vp run check
                vp test run --project unit --shard=1/3
              directory: ''
              node-options: ''
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: ./.github/actions/clone
      - name: Clone ecosystem project
        id: ecosystem-project
        background: true
        run: |
          git config --global core.autocrlf false
          node ecosystem-ci/clone.ts "$ECOSYSTEM_PROJECT"
        env:
          ECOSYSTEM_PROJECT: ${{ matrix.project.name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.project.node-version }}
          package-manager-cache: false
      - name: Download vite-plus packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vite-plus-packages-${{ matrix.os }}
          path: tmp/tgz
          run-id: 38199482199
          github-token: ${{ github.token }}
      - name: Install Codiff native-keymap dependencies
        if: matrix.project.name == 'codiff'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libx11-dev libxkbfile-dev
      - name: Install vp CLI
        run: |
          # Place vp binary where install-global-cli.ts expects it (target/release/)
          mkdir -p target/release
          cp tmp/tgz/vp target/release/vp 2>/dev/null || cp tmp/tgz/vp.exe target/release/vp.exe 2>/dev/null || true
          cp tmp/tgz/vp-shim.exe target/release/vp-shim.exe 2>/dev/null || true
          chmod +x target/release/vp 2>/dev/null || true
          VP_TGZ=$(ls "$GITHUB_WORKSPACE"/tmp/tgz/vite-plus-[0-9]*.tgz | head -n1)
          node "$GITHUB_WORKSPACE"/packages/tools/src/install-global-cli.ts --tgz "$VP_TGZ"
          # Use USERPROFILE (native Windows path) instead of HOME (Git Bash path /c/Users/...)
          # so cmd.exe and Node.js execSync can resolve binaries in PATH
          echo "${USERPROFILE:-$HOME}/.vite-plus/bin" >> $GITHUB_PATH
      - wait: ecosystem-project
      - name: Migrate in ${{ matrix.project.name }}
        working-directory: ${{ runner.temp }}/vite-plus-ecosystem-ci/${{ matrix.project.name }}${{ matrix.project.directory && format('/{0}', matrix.project.directory) || '' }}
        run: node $GITHUB_WORKSPACE/ecosystem-ci/patch-project.ts ${{ matrix.project.name }}
      - name: Verify local packages installed
        working-directory: ${{ runner.temp }}/vite-plus-ecosystem-ci/${{ matrix.project.name }}${{ matrix.project.directory && format('/{0}', matrix.project.directory) || '' }}
        run: node $GITHUB_WORKSPACE/ecosystem-ci/verify-install.ts
      - name: Determine playwright requirement
        id: pw
        run: |
          needs=$(jq -r --arg p '${{ matrix.project.name }}' '.[$p].playwright // false' "$GITHUB_WORKSPACE/ecosystem-ci/repo.json")
          echo "needs=$needs" >> "$GITHUB_OUTPUT"
      - name: Install Playwright chromium
        if: steps.pw.outputs.needs == 'true'
        working-directory: ${{ runner.temp }}/vite-plus-ecosystem-ci/${{ matrix.project.name }}${{ matrix.project.directory && format('/{0}', matrix.project.directory) || '' }}
        run: npx playwright install chromium
      - name: Run vite-plus commands in ${{ matrix.project.name }}
        working-directory: ${{ runner.temp }}/vite-plus-ecosystem-ci/${{ matrix.project.name }}${{ matrix.project.directory && format('/{0}', matrix.project.directory) || '' }}
        env:
          NODE_OPTIONS: ${{ matrix.project.node-options || '' }}
        run: |
          # vp migrate's auto-install passes --ignore-scripts on pnpm v11
          # (vinext pins pnpm 11), which skips vinext's approved
          # better-sqlite3 build, and the follow-up `vp install` never
          # re-runs it. Rebuild it so the better-auth fixture works.
          vp rebuild -- -r better-sqlite3
          vp run build
          vp check --fix
          vp run check
          vp test run --project unit --shard=1/3 --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/vinext-report.json"
      - name: Record tested inputs
        if: always()
        run: |
          sha256sum tmp/tgz/* > "$RUNNER_TEMP/vinext-package-sha256.txt"
          git -C "$RUNNER_TEMP/vite-plus-ecosystem-ci/vinext" rev-parse HEAD > "$RUNNER_TEMP/vinext-source-sha.txt"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vinext-report-${{ matrix.group }}
          path: |-
            ${{ runner.temp }}/vinext-report.json
            ${{ runner.temp }}/vinext-package-sha256.txt
            ${{ runner.temp }}/vinext-source-sha.txt
          if-no-files-found: error
          retention-days: 3
  split:
    name: Vinext split (${{ matrix.group }})
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TEST_PATTERN: ${{ matrix.pattern }}
    permissions:
      contents: read
      packages: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.project.timeout || 10 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: rest
            pattern: ^(?!.*assetPrefix end-to-end build > (?:(?:deployment ID:|path-prefix:)|(?:absolute URL:|basePath \+ assetPrefix:)|(?:basePath alone:|unset:))).*$
            os: ubuntu-latest
            project: *id001
          - group: builds-1
            pattern: assetPrefix end-to-end build > (?:deployment ID:|path-prefix:)
            os: ubuntu-latest
            project: *id001
          - group: builds-2
            pattern: assetPrefix end-to-end build > (?:absolute URL:|basePath \+ assetPrefix:)
            os: ubuntu-latest
            project: *id001
          - group: builds-3
            pattern: assetPrefix end-to-end build > (?:basePath alone:|unset:)
            os: ubuntu-latest
            project: *id001
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: ./.github/actions/clone
      - name: Clone ecosystem project
        id: ecosystem-project
        background: true
        run: |
          git config --global core.autocrlf false
          node ecosystem-ci/clone.ts "$ECOSYSTEM_PROJECT"
        env:
          ECOSYSTEM_PROJECT: ${{ matrix.project.name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.project.node-version }}
          package-manager-cache: false
      - name: Download vite-plus packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vite-plus-packages-${{ matrix.os }}
          path: tmp/tgz
          run-id: 38199482199
          github-token: ${{ github.token }}
      - name: Install Codiff native-keymap dependencies
        if: matrix.project.name == 'codiff'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libx11-dev libxkbfile-dev
      - name: Install vp CLI
        run: |
          # Place vp binary where install-global-cli.ts expects it (target/release/)
          mkdir -p target/release
          cp tmp/tgz/vp target/release/vp 2>/dev/null || cp tmp/tgz/vp.exe target/release/vp.exe 2>/dev/null || true
          cp tmp/tgz/vp-shim.exe target/release/vp-shim.exe 2>/dev/null || true
          chmod +x target/release/vp 2>/dev/null || true
          VP_TGZ=$(ls "$GITHUB_WORKSPACE"/tmp/tgz/vite-plus-[0-9]*.tgz | head -n1)
          node "$GITHUB_WORKSPACE"/packages/tools/src/install-global-cli.ts --tgz "$VP_TGZ"
          # Use USERPROFILE (native Windows path) instead of HOME (Git Bash path /c/Users/...)
          # so cmd.exe and Node.js execSync can resolve binaries in PATH
          echo "${USERPROFILE:-$HOME}/.vite-plus/bin" >> $GITHUB_PATH
      - wait: ecosystem-project
      - name: Migrate in ${{ matrix.project.name }}
        working-directory: ${{ runner.temp }}/vite-plus-ecosystem-ci/${{ matrix.project.name }}${{ matrix.project.directory && format('/{0}', matrix.project.directory) || '' }}
        run: node $GITHUB_WORKSPACE/ecosystem-ci/patch-project.ts ${{ matrix.project.name }}
      - name: Verify local packages installed
        working-directory: ${{ runner.temp }}/vite-plus-ecosystem-ci/${{ matrix.project.name }}${{ matrix.project.directory && format('/{0}', matrix.project.directory) || '' }}
        run: node $GITHUB_WORKSPACE/ecosystem-ci/verify-install.ts
      - name: Determine playwright requirement
        id: pw
        run: |
          needs=$(jq -r --arg p '${{ matrix.project.name }}' '.[$p].playwright // false' "$GITHUB_WORKSPACE/ecosystem-ci/repo.json")
          echo "needs=$needs" >> "$GITHUB_OUTPUT"
      - name: Install Playwright chromium
        if: steps.pw.outputs.needs == 'true'
        working-directory: ${{ runner.temp }}/vite-plus-ecosystem-ci/${{ matrix.project.name }}${{ matrix.project.directory && format('/{0}', matrix.project.directory) || '' }}
        run: npx playwright install chromium
      - name: Run vite-plus commands in ${{ matrix.project.name }}
        working-directory: ${{ runner.temp }}/vite-plus-ecosystem-ci/${{ matrix.project.name }}${{ matrix.project.directory && format('/{0}', matrix.project.directory) || '' }}
        env:
          NODE_OPTIONS: ${{ matrix.project.node-options || '' }}
        run: |
          # vp migrate's auto-install passes --ignore-scripts on pnpm v11
          # (vinext pins pnpm 11), which skips vinext's approved
          # better-sqlite3 build, and the follow-up `vp install` never
          # re-runs it. Rebuild it so the better-auth fixture works.
          vp rebuild -- -r better-sqlite3
          vp run build
          vp check --fix
          vp run check
          vp test run --project unit --shard=1/3 --testNamePattern="$TEST_PATTERN" --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/vinext-report.json"
      - name: Record tested inputs
        if: always()
        run: |
          sha256sum tmp/tgz/* > "$RUNNER_TEMP/vinext-package-sha256.txt"
          git -C "$RUNNER_TEMP/vite-plus-ecosystem-ci/vinext" rev-parse HEAD > "$RUNNER_TEMP/vinext-source-sha.txt"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vinext-report-${{ matrix.group }}
          path: |-
            ${{ runner.temp }}/vinext-report.json
            ${{ runner.temp }}/vinext-package-sha256.txt
            ${{ runner.temp }}/vinext-source-sha.txt
          if-no-files-found: error
          retention-days: 3
    needs:
      - baseline
  coverage:
    name: Verify identical executed tests
    needs:
      - baseline
      - split
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: vinext-report-*
          path: reports
      - name: Compare every passing test and package digest
        run: |
          python3 - <<'PYTHON'
          from collections import Counter
          from pathlib import Path
          import json
          reports = Path('reports')
          def passed(group):
              report = json.loads((reports / ('vinext-report-' + group) / 'vinext-report.json').read_text())
              assert report['success'], group
              tests = Counter()
              for file in report['testResults']:
                  name = file['name'].split('/vinext/', 1)[1]
                  for case in file['assertionResults']:
                      assert case['status'] not in ['failed'], (group, name, case)
                      if case['status'] == 'passed':
                          tests[(name, case['fullName'])] += 1
              return tests
          baseline = passed('baseline')
          assert len(baseline) > 4000, 'Expected the complete original Vinext shard'
          combined = Counter()
          for group in ['rest', 'builds-1', 'builds-2', 'builds-3']:
              part = passed(group)
              assert part, group
              if group.startswith('builds-'):
                  assert sum(part.values()) == 2, (group, part)
              combined.update(part)
          assert combined == baseline, {'missing': list((baseline - combined).items())[:20], 'extra': list((combined - baseline).items())[:20]}
          for file in ['vinext-package-sha256.txt', 'vinext-source-sha.txt']:
              values = [(directory / file).read_text() for directory in reports.iterdir()]
              assert len(set(values)) == 1, file
          print('Identical tested packages and pinned fixture. Exact passed-test multiset preserved:', sum(baseline.values()))
          PYTHON
