name: Repository install scheduling benchmark
'on':
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: vp-install-test-scheduling
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  baseline:
    name: Install baseline
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: ./.github/actions/clone
      - uses: ./.github/actions/install-benchmark-setup-node
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rolldown-binaries
          path: ./rolldown/packages/rolldown/src
          merge-multiple: true
          run-id: 38206828865
          github-token: ${{ github.token }}
      - uses: ./.github/actions/download-cli-test-binaries
        with:
          target: x86_64-unknown-linux-gnu
      - name: Build with upstream
        uses: ./.github/actions/build-upstream
        with:
          target: x86_64-unknown-linux-gnu
          skip-native: true
      - name: Build CLI
        run: |
          pnpm bootstrap-cli:ci
          echo "$HOME/.vite-plus/bin" >> $GITHUB_PATH
      - name: Run local CLI `vp install`
        run: |
          export PATH=$PWD/node_modules/.bin:$PATH
          vp -h
          # Test vp install on various repositories with different package managers
          # Entry format: "owner/repo:dir" or "owner/repo:dir:ref" (tag or branch to clone)
          repos=(
            # pnpm workspace
            # Pinned to the latest stable tag: pnpm main pins pnpm v12 alphas,
            # whose @pnpm/exe ships a placeholder bin that breaks pnpm's
            # version self-switch (pnpm/pnpm#12811)
            "pnpm/pnpm:pnpm:v11.11.0"
            "vitejs/vite:vite"
            # yarn workspace
            "napi-rs/napi-rs:napi-rs"
            "toeverything/AFFiNE:AFFiNE"
            # npm workspace
            "npm/cli:npm"
            "redhat-developer/vscode-extension-tester:vscode-extension-tester"
          )

          for repo_info in "${repos[@]}"; do
            IFS=':' read -r repo dir_name ref <<< "$repo_info"
            echo "Testing vp install on $repo${ref:+ ($ref)}…"
            # remove the directory if it exists
            if [ -d "$RUNNER_TEMP/$dir_name" ]; then
              rm -rf "${RUNNER_TEMP:?}/${dir_name:?}"
            fi
            clone_args=(--depth 1)
            if [ -n "$ref" ]; then
              clone_args+=(--branch "$ref")
            fi
            git clone "${clone_args[@]}" "https://github.com/$repo.git" "$RUNNER_TEMP/$dir_name"
            cd "$RUNNER_TEMP/$dir_name"
          expected_sha=$(jq -er --arg repo "$repo" '.[$repo]' "$GITHUB_WORKSPACE/.github/benchmark/install-refs.json")
          git fetch --depth 1 origin "$expected_sha"
          git checkout --detach "$expected_sha"
          test "$(git rev-parse HEAD)" = "$expected_sha"
          echo "INPUT_REPOSITORY $repo $expected_sha"

            vp install --no-frozen-lockfile
            # run again to show install cache increase by time
            time vp install
            echo "✓ Successfully installed dependencies for $repo"
            echo ""
          done
      - name: Record CLI artifact digest
        run: sha256sum "$RUNNER_TEMP/cli-test-binaries.tar.gz"
    permissions:
      contents: read
      packages: read
      actions: read
  parallel:
    name: Install parallel (${{ matrix.repository }})
    runs-on: namespace-profile-linux-x64-default
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: pnpm/pnpm
            directory: pnpm
            ref: v11.11.0
          - repository: vitejs/vite
            directory: vite
          - repository: napi-rs/napi-rs
            directory: napi-rs
          - repository: toeverything/AFFiNE
            directory: AFFiNE
          - repository: npm/cli
            directory: npm
          - repository: redhat-developer/vscode-extension-tester
            directory: vscode-extension-tester
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: ./.github/actions/clone
      - uses: ./.github/actions/install-benchmark-setup-node
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rolldown-binaries
          path: ./rolldown/packages/rolldown/src
          merge-multiple: true
          run-id: 38206828865
          github-token: ${{ github.token }}
      - uses: ./.github/actions/download-cli-test-binaries
        with:
          target: x86_64-unknown-linux-gnu
      - name: Build with upstream
        uses: ./.github/actions/build-upstream
        with:
          target: x86_64-unknown-linux-gnu
          skip-native: true
      - name: Build CLI
        run: |
          pnpm bootstrap-cli:ci
          echo "$HOME/.vite-plus/bin" >> $GITHUB_PATH
      - name: Run local CLI `vp install`
        env:
          REPO: ${{ matrix.repository }}
          REPO_DIR: ${{ matrix.directory }}
          REPO_REF: ${{ matrix.ref }}
        run: |
          export PATH=$PWD/node_modules/.bin:$PATH
          vp -h
          echo "Testing vp install on $REPO${REPO_REF:+ ($REPO_REF)}…"
          if [ -d "$RUNNER_TEMP/$REPO_DIR" ]; then
            rm -rf "${RUNNER_TEMP:?}/${REPO_DIR:?}"
          fi
          clone_args=(--depth 1)
          if [ -n "$REPO_REF" ]; then
            clone_args+=(--branch "$REPO_REF")
          fi
          git clone "${clone_args[@]}" "https://github.com/$REPO.git" "$RUNNER_TEMP/$REPO_DIR"
          cd "$RUNNER_TEMP/$REPO_DIR"
          expected_sha=$(jq -er --arg repo "$REPO" '.[$repo]' "$GITHUB_WORKSPACE/.github/benchmark/install-refs.json")
          git fetch --depth 1 origin "$expected_sha"
          git checkout --detach "$expected_sha"
          test "$(git rev-parse HEAD)" = "$expected_sha"
          echo "INPUT_REPOSITORY $REPO $expected_sha"

          vp install --no-frozen-lockfile
          # Keep the second install in this job so it uses the first install's cache.
          time vp install
          echo "✓ Successfully installed dependencies for $REPO"
      - name: Record CLI artifact digest
        run: sha256sum "$RUNNER_TEMP/cli-test-binaries.tar.gz"
    permissions:
      contents: read
      packages: read
      actions: read
    needs:
      - baseline
