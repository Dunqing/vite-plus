name: Build Windows CLI binaries
description: Cross-compile the Windows release NAPI binding and vp/vp-shim/vp-setup binaries on Linux with cargo-xwin, cache them by source hash, and upload them as an artifact for Windows jobs to consume (with build-upstream's skip-native input). Run on a Linux runner after checkout + clone.
inputs:
  save-cache:
    description: Whether setup-xwin's setup-rust should save its cache (usually only on main).
    required: false
    default: 'false'
  artifact-name:
    description: Name for the uploaded binaries artifact.
    required: false
    default: windows-cli-binaries
runs:
  using: composite
  steps:
  - uses: ./.github/actions/compute-native-cache-input-hash
    id: native-cache-inputs
  - name: Compute binaries cache key
    id: cache-key
    shell: bash
    run: |
      echo "key=windows-cli-xwin-v2-${{ steps.native-cache-inputs.outputs.hash }}" >> "$GITHUB_OUTPUT"
  - name: Define binary paths
    id: binary-paths
    shell: bash
    run: |
      {
        echo 'paths<<EOF'
        echo 'packages/cli/binding/*.node'
        echo 'packages/cli/binding/vite-plus.build-time'
        echo 'packages/cli/binding/vite-plus.cargo-metadata.json'
        echo 'target/x86_64-pc-windows-msvc/release/vp.exe'
        echo 'target/x86_64-pc-windows-msvc/release/vp-shim.exe'
        echo 'target/x86_64-pc-windows-msvc/release/vp-setup.exe'
        echo 'EOF'
      } >> "$GITHUB_OUTPUT"
  - name: Restore binaries cache
    id: binaries-cache
    uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
    with:
      path: ${{ steps.binary-paths.outputs.paths }}
      key: ${{ steps.cache-key.outputs.key }}
    if: 'false'
  - uses: ./.github/actions/benchmark-sdk-router
    if: steps.binaries-cache.outputs.cache-hit != 'true'
    with:
      save-cache: 'false'
      cache-key: windows-cli-cross
  - uses: ./.github/actions/benchmark-sdk-node
    if: steps.binaries-cache.outputs.cache-hit != 'true'
  - name: Build NAPI binding
    if: steps.binaries-cache.outputs.cache-hit != 'true'
    shell: bash
    run: python3 .github/benchmark/pr2995/measure.py run napi bash .github/benchmark/pr2995/napi.sh
    env:
      DEBUG: napi:*
      XWIN_ACCEPT_LICENSE: '1'
      CXXFLAGS: -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
  - name: Build Rust CLI binaries
    if: steps.binaries-cache.outputs.cache-hit != 'true'
    shell: bash
    run: python3 .github/benchmark/pr2995/measure.py run cli bash .github/benchmark/pr2995/cli.sh
    env:
      XWIN_ACCEPT_LICENSE: '1'
      CXXFLAGS: -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
  - name: Build trampoline shim binary
    if: steps.binaries-cache.outputs.cache-hit != 'true'
    shell: bash
    run: python3 .github/benchmark/pr2995/measure.py run trampoline bash .github/benchmark/pr2995/trampoline.sh
    env:
      XWIN_ACCEPT_LICENSE: '1'
  - name: Export Cargo metadata
    if: steps.binaries-cache.outputs.cache-hit != 'true'
    shell: bash
    run: |
      cargo metadata --locked --format-version 1 \
        | jq '{packages: [.packages[] | {name, version, source}]}' \
        > packages/cli/binding/vite-plus.cargo-metadata.json
  - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
    with:
      name: ${{ inputs.artifact-name }}
      path: ${{ steps.binary-paths.outputs.paths }}
      if-no-files-found: error
      retention-days: 7
  - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
    if: 'false'
    with:
      path: ${{ steps.binary-paths.outputs.paths }}
      key: ${{ steps.cache-key.outputs.key }}
