name: PR 2995 isolated Windows SDK comparison
run-name: PR 2995 r2 / ${{ inputs.variant }} / ${{ inputs.cache_state }} / ${{ inputs.sample }}
'on':
  workflow_dispatch:
    inputs:
      variant:
        type: choice
        required: true
        options:
        - main
        - pr
      cache_state:
        type: choice
        required: true
        options:
        - cold
        - warm
      sample:
        type: choice
        required: true
        options:
        - '1'
        - '2'
permissions:
  contents: read
  packages: read
concurrency:
  group: vp-pr2995-r2
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    name: Windows SDK and native build
    runs-on: namespace-profile-linux-x64-default
    timeout-minutes: 60
    env:
      SDK_VARIANT: ${{ inputs.variant }}
      SDK_CACHE_STATE: ${{ inputs.cache_state }}
      SDK_SAMPLE: ${{ inputs.sample }}
    steps:
    - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
    - uses: ./.github/actions/clone
    - name: Record benchmark inputs and runner state
      shell: bash
      run: python3 .github/benchmark/pr2995/measure.py init
    - uses: ./.github/actions/benchmark-sdk-build
      with:
        save-cache: 'false'
        artifact-name: windows-cli-sdk-${{ inputs.variant }}-${{ inputs.cache_state }}-${{ inputs.sample }}
    - name: Save isolated main SDK cache
      if: inputs.variant == 'main' && inputs.cache_state == 'cold'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/cargo-xwin
        key: vp-pr2995-r2-${{ env.SDK_SAMPLE }}-main-cargo-xwin-msvc-17
    - name: Save isolated pr SDK cache
      if: inputs.variant == 'pr' && inputs.cache_state == 'cold'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cache/cargo-xwin/windows-msvc-sysroot/include
          ~/.cache/cargo-xwin/windows-msvc-sysroot/lib/x86_64-unknown-windows-msvc
          ~/.cache/cargo-xwin/xwin
        key: vp-pr2995-r2-${{ env.SDK_SAMPLE }}-pr-cargo-xwin-sysroot-2026-09-15-clang-cl-22-x64-v1
    - name: Finalize benchmark measurements
      shell: bash
      run: python3 .github/benchmark/pr2995/measure.py finish
    - name: Upload measurements and command logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: pr-2995-measurements
        path: ${{ runner.temp }}/pr-2995
        if-no-files-found: warn
        retention-days: 14
