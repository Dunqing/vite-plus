name: Native optimization level benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: vp-native-opt-level-r1
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  VP_CI_BENCH_CACHE_STATE: cold
jobs:
  build:
    name: Native optimization level ${{ matrix.opt-level }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        opt-level: [3, 2, 1]
    env:
      CARGO_PROFILE_RELEASE_LTO: 'off'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ matrix.opt-level }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: ./.github/actions/clone
      - uses: ./.github/actions/benchmark-setup-rust
        with:
          cache-key: native-profile
      - uses: ./.github/actions/benchmark-setup-node
      - name: Build native binaries and JavaScript packages
        uses: ./.github/actions/build-upstream
        with:
          target: x86_64-unknown-linux-gnu
      - name: Check version and run unit tests
        run: |
          pnpm vp --version
          pnpm test:unit
      - name: Record binary sizes
        run: ls -l target/x86_64-unknown-linux-gnu/release/vp packages/cli/binding/*.node
