name: Ecosystem browser ephemeral-port validation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  packages: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  test:
    name: Dashboard browser port (${{ matrix.os }})
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
      actions: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.project.timeout || 10 }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - namespace-profile-windows-4c-8g
        project:
          - name: vibe-dashboard
            node-version: 24
            command: |
              # FIXME: Failed to load JS plugin: ./plugins/debugger.js
              # vp run ready
              vp fmt
              vp test
              vp run build
            timeout: 10
            directory: ''
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: ./.github/actions/clone
      - name: Clone ecosystem project
        id: ecosystem-project
        background: true
        run: |
          git config --global core.autocrlf false
          node ecosystem-ci/clone.ts "$ECOSYSTEM_PROJECT"
        env:
          ECOSYSTEM_PROJECT: ${{ matrix.project.name }}
      - name: Disable Windows Defender
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.project.node-version }}
          package-manager-cache: false
      - name: Download vite-plus packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vite-plus-packages-${{ matrix.os }}
          path: tmp/tgz
          run-id: 38229548695
          github-token: ${{ github.token }}
      - name: Install Codiff native-keymap dependencies
        if: matrix.project.name == 'codiff'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libx11-dev libxkbfile-dev
      - name: Install vp CLI
        run: |
          # Place vp binary where install-global-cli.ts expects it (target/release/)
          mkdir -p target/release
          cp tmp/tgz/vp target/release/vp 2>/dev/null || cp tmp/tgz/vp.exe target/release/vp.exe 2>/dev/null || true
          cp tmp/tgz/vp-shim.exe target/release/vp-shim.exe 2>/dev/null || true
          chmod +x target/release/vp 2>/dev/null || true
          VP_TGZ=$(ls "$GITHUB_WORKSPACE"/tmp/tgz/vite-plus-[0-9]*.tgz | head -n1)
          node "$GITHUB_WORKSPACE"/packages/tools/src/install-global-cli.ts --tgz "$VP_TGZ"
          # Use USERPROFILE (native Windows path) instead of HOME (Git Bash path /c/Users/...)
          # so cmd.exe and Node.js execSync can resolve binaries in PATH
          echo "${USERPROFILE:-$HOME}/.vite-plus/bin" >> $GITHUB_PATH
      - wait: ecosystem-project
      - name: Migrate in ${{ matrix.project.name }}
        working-directory: ${{ runner.temp }}/vite-plus-ecosystem-ci/${{ matrix.project.name }}${{ matrix.project.directory && format('/{0}', matrix.project.directory) || '' }}
        run: node $GITHUB_WORKSPACE/ecosystem-ci/patch-project.ts ${{ matrix.project.name }}
      - name: Verify local packages installed
        working-directory: ${{ runner.temp }}/vite-plus-ecosystem-ci/${{ matrix.project.name }}${{ matrix.project.directory && format('/{0}', matrix.project.directory) || '' }}
        run: node $GITHUB_WORKSPACE/ecosystem-ci/verify-install.ts
      - name: Determine playwright requirement
        id: pw
        run: |
          needs=$(jq -r --arg p '${{ matrix.project.name }}' '.[$p].playwright // false' "$GITHUB_WORKSPACE/ecosystem-ci/repo.json")
          echo "needs=$needs" >> "$GITHUB_OUTPUT"
      - name: Install Playwright chromium
        if: steps.pw.outputs.needs == 'true'
        working-directory: ${{ runner.temp }}/vite-plus-ecosystem-ci/${{ matrix.project.name }}${{ matrix.project.directory && format('/{0}', matrix.project.directory) || '' }}
        run: npx playwright install chromium
      - name: Deny the default browser API port
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const hook = `${process.env.GITHUB_WORKSPACE.replaceAll('\\', '/')}/.github/benchmark/deny-default-port.cjs`;
          appendFileSync(process.env.GITHUB_ENV, `VP_PORT_VALIDATION_NODE_OPTIONS=--require="${hook}"\n`);
          NODE
      - name: Require the root API port override to fail in the child project
        working-directory: ${{ runner.temp }}/vite-plus-ecosystem-ci/${{ matrix.project.name }}${{ matrix.project.directory && format('/{0}', matrix.project.directory) || '' }}
        env:
          NODE_OPTIONS: ${{ env.VP_PORT_VALIDATION_NODE_OPTIONS }}
        run: |
          cp apps/dashboard/vite.config.ts "$RUNNER_TEMP/vibe-dashboard-fixed-config.ts"
          git show HEAD:apps/dashboard/vite.config.ts > apps/dashboard/vite.config.ts
          if vp test --api.port=3000 > "$RUNNER_TEMP/vibe-dashboard-before.log" 2>&1; then
            cat "$RUNNER_TEMP/vibe-dashboard-before.log"
            echo 'The original browser project unexpectedly passed with port 63315 denied'
            exit 1
          fi
          cat "$RUNNER_TEMP/vibe-dashboard-before.log"
          grep -F 'SIMULATED_DEFAULT_PORT_EACCES' "$RUNNER_TEMP/vibe-dashboard-before.log"
          cp "$RUNNER_TEMP/vibe-dashboard-fixed-config.ts" apps/dashboard/vite.config.ts
          echo 'Confirmed: root --api.port does not prevent the child browser project failure'
      - name: Run vite-plus commands in ${{ matrix.project.name }}
        working-directory: ${{ runner.temp }}/vite-plus-ecosystem-ci/${{ matrix.project.name }}${{ matrix.project.directory && format('/{0}', matrix.project.directory) || '' }}
        env:
          NODE_OPTIONS: ${{ env.VP_PORT_VALIDATION_NODE_OPTIONS }}
        run: ${{ matrix.project.command }}
