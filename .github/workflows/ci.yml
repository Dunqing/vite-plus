name: PR 2988 isolated native CI benchmark
run-name: PR 2988 / ${{ inputs.variant }} / ${{ inputs.cache_state }} / ${{ inputs.target }}
'on':
  workflow_dispatch:
    inputs:
      variant:
        type: choice
        required: true
        options:
        - before
        - after
      cache_state:
        type: choice
        required: true
        options:
        - cold
        - prime
        - warm
      target:
        type: choice
        required: true
        options:
        - all
        - linux
        - macos
        - windows
        - musl
permissions:
  contents: read
  packages: read
concurrency:
  group: vp-pr2988-r1
  cancel-in-progress: false
jobs:
  before:
    if: inputs.variant == 'before'
    uses: ./.github/workflows/benchmark-pr2988-before.yml
    with:
      cache_state: ${{ inputs.cache_state }}
      target: ${{ inputs.target }}
  after:
    if: inputs.variant == 'after'
    uses: ./.github/workflows/benchmark-pr2988-after.yml
    with:
      cache_state: ${{ inputs.cache_state }}
      target: ${{ inputs.target }}
