name: Early snapshot artifact smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: vp-ci-scheduling-2986-r1
  cancel-in-progress: false
jobs:
  producer:
    name: Smoke artifact producer
    runs-on: ubuntu-latest
    steps:
      - name: Prepare artifacts after consumers have started
        shell: bash
        run: |
          sleep 45
          mkdir -p native snapshots
          echo native > native/native.txt
          echo snapshots > snapshots/snapshots.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: smoke-native
          path: native/native.txt
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: smoke-snapshots
          path: snapshots/snapshots.txt
          retention-days: 1
  consumer:
    name: Consume delayed artifacts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - namespace-profile-linux-x64-default
          - namespace-profile-mac-default
          - namespace-profile-windows-4c-8g
    runs-on: ${{ matrix.os }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: ./.github/actions/download-ci-artifacts
        id: artifacts
        background: true
        with:
          artifact-names: |
            smoke-native
            smoke-snapshots
          producer-names: Smoke artifact producer
          path: artifact-smoke
      - name: Prepare independent files
        shell: bash
        run: echo setup-completed > setup-completed.txt
      - wait: artifacts
      - name: Verify both artifacts and setup
        shell: bash
        run: |
          test "$(cat artifact-smoke/native.txt)" = native
          test "$(cat artifact-smoke/snapshots.txt)" = snapshots
          test "$(cat setup-completed.txt)" = setup-completed
