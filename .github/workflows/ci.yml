name: Diagnose Linux snapshot command stalls
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: vp-ci-scheduling-2986-r1
  cancel-in-progress: false
env:
  VP_CI_BENCH_CACHE_STATE: warm
  VP_CI_BENCH_VARIANT: after
jobs:
  snapshots:
    name: Diagnose Linux snapshots (shard ${{ matrix.shard }}/6)
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 2
          - 3
        include:
          - os: namespace-profile-linux-x64-default
            target: x86_64-unknown-linux-gnu
            shards: 6
    runs-on: ${{ matrix.os }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: ./.github/actions/clone
      - name: Install snapshot shells
        id: snapshot-shells
        background: true
        run: |
          for snapshot_shell in fish zsh; do
            if ! command -v "$snapshot_shell" >/dev/null 2>&1; then
              if [ "$RUNNER_OS" = 'Linux' ]; then
                sudo apt-get update
                sudo apt-get install --yes "$snapshot_shell"
              else
                brew install "$snapshot_shell"
              fi
            fi
            "$snapshot_shell" --version
          done
      - name: Install Nushell
        uses: hustcer/setup-nu@ccd5bb5426b05a32009c2ba967946231f3919c97
        with:
          version: '*'
      - uses: ./.github/actions/benchmark-after-setup-ci-node
      - name: Download exact binaries from failed preparation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cli-test-binaries-${{ matrix.target }}
          path: ${{ runner.temp }}
          run-id: 38302410714
          github-token: ${{ github.token }}
      - name: Extract exact binaries
        run: |-
          tar -xzf "$RUNNER_TEMP/cli-test-binaries.tar.gz"
          sha256sum target/snapshot-tests/cli_snapshots packages/cli/binding/*.node target/x86_64-unknown-linux-gnu/release/vp
      - name: Install Playwright Chromium
        id: playwright
        background: true
        run: pnpm exec playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
      - name: Build with upstream
        uses: ./.github/actions/benchmark-after-build-upstream
        with:
          target: ${{ matrix.target }}
          skip-native: true
      - name: Install Global CLI vp
        run: pnpm bootstrap-cli:ci
      - name: Prewarm managed runtime
        run: |
          "$HOME/.vite-plus/bin/vp" node --version \
            || echo "prewarm failed; cases will download the runtime on demand"
      - wait:
          - snapshot-shells
          - playwright
      - name: Prepare process diagnostics
        run: command -v strace || (sudo apt-get update && sudo apt-get install --yes strace)
      - name: Run PTY snapshot tests
        run: python3 .github/benchmark/trace-snapshot-hang.py .github/benchmark/run-snapshot-diagnostic.sh
        env:
          RUST_BACKTRACE: '1'
          CARGO_MANIFEST_DIR: ${{ github.workspace }}/crates/vp_cli_snapshots
          CARGO_BIN_EXE_vpt: ${{ github.workspace }}/target/snapshot-tests/vpt
          VP_SNAP_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
          VP_SNAP_ARTIFACTS_DIR: ${{ runner.temp }}/snapshot-artifacts
      - name: Upload snapshot diagnostics and timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: snapshot-diagnostics-${{ matrix.target }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/snapshot-artifacts
          if-no-files-found: ignore
          retention-days: 7
