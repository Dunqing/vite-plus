name: Browser snapshot ephemeral-port validation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  packages: read
  actions: read
concurrency:
  group: vp-browser-port-validation
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  test:
    name: Windows browser snapshots with simulated default-port EACCES
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
    runs-on: namespace-profile-windows-4c-8g
    steps:
    - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
    - uses: ./.github/actions/clone
    - name: Setup Dev Drive
      uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0
      with:
        drive-size: 12GB
        drive-format: ReFS
        env-mapping: |
          TEMP,{{ DEV_DRIVE }}/Temp
          TMP,{{ DEV_DRIVE }}/Temp
    - name: Create TEMP/TMP on Dev Drive
      shell: bash
      run: mkdir -p "$TEMP" "$TMP"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: windows-snapshot-test-archive
        run-id: 38214141357
        github-token: ${{ github.token }}
    - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
      with:
        tool: cargo-nextest
    - uses: oxc-project/setup-node@1f1a5b4450c8905bd1830c3a908d22b960c4559a
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: rolldown-binaries
        path: ./rolldown/packages/rolldown/src
        merge-multiple: true
        run-id: 38214141357
        github-token: ${{ github.token }}
    - name: Download prebuilt Windows binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: windows-cli-binaries
        run-id: 38214141357
        github-token: ${{ github.token }}
    - name: Install Playwright Chromium
      id: playwright
      background: true
      run: pnpm exec playwright install chromium
      env:
        PLAYWRIGHT_BROWSERS_PATH: '0'
    - name: Build with upstream
      uses: ./.github/actions/build-upstream
      with:
        target: x86_64-pc-windows-msvc
        skip-native: true
    - name: Install Global CLI vp
      shell: bash
      run: pnpm bootstrap-cli:ci
    - name: Prewarm managed runtime
      shell: bash
      run: |
        "$USERPROFILE/.vite-plus/bin/vp.exe" node --version \
          || echo "prewarm failed; cases will download the runtime on demand"
    - name: Create NTFS temp directory for case-sensitive shim snapshots
      if: matrix.shard == 1
      id: snapshot-temp
      shell: pwsh
      run: |
        $volume = [System.IO.Path]::GetPathRoot($env:RUNNER_TEMP)
        $snapshotTemp = Join-Path $volume ('vp-snapshots-' + [guid]::NewGuid().ToString('N'))
        New-Item -ItemType Directory -Path $snapshotTemp | Out-Null
        "directory=$snapshotTemp" >> $env:GITHUB_OUTPUT
    - wait: playwright
    - name: Inject bind denial for the default API port
      run: |
        cat > "$RUNNER_TEMP/deny-default-port.cjs" <<'NODE'
        const { Server } = require('node:net');
        const listen = Server.prototype.listen;
        Server.prototype.listen = function (...args) {
          const options = args[0];
          const port = typeof options === 'object' ? options?.port : options;
          if (Number(port) === 63315) {
            console.error('SIMULATED_DEFAULT_PORT_EACCES');
            const error = Object.assign(new Error('SIMULATED_DEFAULT_PORT_EACCES: listen ::1:63315'), {
              code: 'EACCES', errno: -4092, syscall: 'listen', address: '::1', port: 63315,
            });
            process.nextTick(() => this.emit('error', error));
            return this;
          }
          return Reflect.apply(listen, this, args);
        };
        NODE
        node --input-type=module <<'NODE'
        import { readFileSync, writeFileSync } from 'node:fs';
        const hook = `${process.env.RUNNER_TEMP.replaceAll('\\', '/')}/deny-default-port.cjs`;
        const options = JSON.stringify(`--require="${hook}"`);
        for (const fixture of ['test_v5_preview', 'test_v5_screenshots']) {
          const path = `crates/vp_cli_snapshots/tests/cli_snapshots/fixtures/${fixture}/snapshots.toml`;
          const source = readFileSync(path, 'utf8');
          writeFileSync(path, source.replaceAll('PLAYWRIGHT_BROWSERS_PATH = "0"', `PLAYWRIGHT_BROWSERS_PATH = "0", NODE_OPTIONS = ${options}`));
        }
        NODE
    - name: Require original fixture to fail with simulated EACCES
      shell: bash
      run: |
        # current/bin, not bin: on Windows bin\vp.exe is the trampoline,
        # which re-execs %VP_HOME%\current\bin\vp.exe; the runner gives
        # each case an isolated VP_HOME with no install inside, so the
        # trampoline would fail. current\bin\vp.exe is the real CLI.
        export VP_SNAP_GLOBAL_VP="$USERPROFILE/.vite-plus/current/bin/vp.exe"
        export VP_SNAP_JS_RUNTIME_DIR="$USERPROFILE/.vite-plus/js_runtime"
        export VP_SNAP_CMD_BIN="$(cygpath -w "$(command -v cmd.exe)")"
        # Keep pwsh at its canonical installation path; copying pwsh.exe
        # alone can break its adjacent runtime dependencies.
        export VP_SNAP_PWSH_BIN="$(cygpath -w "$(command -v pwsh.exe)")"
        # Reserve all nextest workers for cases that need the execution gate.
        # Generate the overrides from the fixtures, including automatic Ctrl-C
        # isolation, so this configuration cannot drift from the runner.
        VP_SNAP_NEXTEST_CONFIG="$RUNNER_TEMP/snapshot-nextest.toml" \
          cargo-nextest nextest list --archive-file windows-snapshot-tests.tar.zst --workspace-remap . \
          > "$RUNNER_TEMP/snapshot-test-list.txt"
        nextest_run_args=(
          --test-threads 8 --config-file "$RUNNER_TEMP/snapshot-nextest.toml"
          --archive-file windows-snapshot-tests.tar.zst --workspace-remap . --no-fail-fast
        )
        # --no-fail-fast: on a snapshot suite every diff is diagnostic
        # signal; cancelling on the first failure hides the rest.
        cp .github/benchmark/preview-before.mjs crates/vp_cli_snapshots/tests/cli_snapshots/fixtures/test_v5_preview/verify.mjs
        if cargo-nextest nextest run "${nextest_run_args[@]}" \
          -E 'test(/^test_v5_preview::preview_runtime$/)' > "$RUNNER_TEMP/browser-port-before.log" 2>&1; then
          cat "$RUNNER_TEMP/browser-port-before.log"
          echo 'The original fixture unexpectedly passed with port 63315 denied'
          exit 1
        fi
        cat "$RUNNER_TEMP/browser-port-before.log"
        grep -F 'SIMULATED_DEFAULT_PORT_EACCES' "$RUNNER_TEMP/browser-port-before.log"
        git restore crates/vp_cli_snapshots/tests/cli_snapshots/fixtures/test_v5_preview/verify.mjs
        echo 'Confirmed: the original fixture fails when the default API port is denied'
      env:
        RUST_BACKTRACE: '1'
        VP_SNAP_PACKAGES_DIR: ${{ runner.temp }}/snapshot-packages
        VP_SNAP_ARTIFACTS_DIR: ${{ runner.temp }}/snapshot-artifacts
        __COMPAT_LAYER: RunAsInvoker
    - name: Run PTY snapshot tests
      shell: bash
      run: |
        # current/bin, not bin: on Windows bin\vp.exe is the trampoline,
        # which re-execs %VP_HOME%\current\bin\vp.exe; the runner gives
        # each case an isolated VP_HOME with no install inside, so the
        # trampoline would fail. current\bin\vp.exe is the real CLI.
        export VP_SNAP_GLOBAL_VP="$USERPROFILE/.vite-plus/current/bin/vp.exe"
        export VP_SNAP_JS_RUNTIME_DIR="$USERPROFILE/.vite-plus/js_runtime"
        export VP_SNAP_CMD_BIN="$(cygpath -w "$(command -v cmd.exe)")"
        # Keep pwsh at its canonical installation path; copying pwsh.exe
        # alone can break its adjacent runtime dependencies.
        export VP_SNAP_PWSH_BIN="$(cygpath -w "$(command -v pwsh.exe)")"
        # Reserve all nextest workers for cases that need the execution gate.
        # Generate the overrides from the fixtures, including automatic Ctrl-C
        # isolation, so this configuration cannot drift from the runner.
        VP_SNAP_NEXTEST_CONFIG="$RUNNER_TEMP/snapshot-nextest.toml" \
          cargo-nextest nextest list --archive-file windows-snapshot-tests.tar.zst --workspace-remap . \
          > "$RUNNER_TEMP/snapshot-test-list.txt"
        nextest_run_args=(
          --test-threads 8 --config-file "$RUNNER_TEMP/snapshot-nextest.toml"
          --archive-file windows-snapshot-tests.tar.zst --workspace-remap . --no-fail-fast
        )
        # --no-fail-fast: on a snapshot suite every diff is diagnostic
        # signal; cancelling on the first failure hides the rest.
        cargo-nextest nextest run "${nextest_run_args[@]}" \
          -E 'test(/^test_v5_(preview|screenshots)::/)'
      env:
        RUST_BACKTRACE: '1'
        VP_SNAP_PACKAGES_DIR: ${{ runner.temp }}/snapshot-packages
        VP_SNAP_ARTIFACTS_DIR: ${{ runner.temp }}/snapshot-artifacts
        __COMPAT_LAYER: RunAsInvoker
    - name: Upload snapshot diagnostics and timings
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: browser-port-diagnostics
        path: ${{ runner.temp }}/snapshot-artifacts
        if-no-files-found: ignore
        retention-days: 7
