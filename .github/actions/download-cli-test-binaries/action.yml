name: Download CLI test binaries
description: Restore the native CLI, bindings, metadata, and snapshot runner from the platform build.
inputs:
  target:
    description: The Rust target built by build-cli-test-binaries.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: cli-test-binaries-${{ inputs.target }}
        path: ${{ runner.temp }}
        run-id: 38206828865
        github-token: ${{ github.token }}
    - name: Extract CLI test binaries
      shell: bash
      run: tar -xzf "$RUNNER_TEMP/cli-test-binaries.tar.gz"
