name: Native compilation profile benchmark
run-name: Native profile / ${{ inputs.profile }}
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        required: true
        options: [release, fast]
permissions:
  contents: read
  packages: read
concurrency:
  group: vp-ci-scheduling-2986-r1
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  VP_CI_BENCH_CACHE_STATE: cold
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: ./.github/actions/clone
      - name: Select faster compilation settings
        if: inputs.profile == 'fast'
        run: |
          echo 'CARGO_PROFILE_RELEASE_LTO=off' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16' >> "$GITHUB_ENV"
      - uses: ./.github/actions/benchmark-setup-rust
        with:
          cache-key: native-profile
      - uses: ./.github/actions/benchmark-setup-node
      - name: Build native binaries and JavaScript packages
        uses: ./.github/actions/build-upstream
        with:
          target: x86_64-unknown-linux-gnu
      - name: Check version and run unit tests
        run: |
          pnpm vp --version
          pnpm test:unit
      - name: Record binary sizes
        run: ls -l target/x86_64-unknown-linux-gnu/release/vp packages/cli/binding/*.node
