name: Windows SDK backend experiment
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  packages: read
concurrency:
  group: vp-ci-scheduling-2986-r1
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    name: Build Windows tests with packaged SDK
    runs-on: namespace-profile-linux-x64-default
    env:
      XWIN_ACCEPT_LICENSE: '1'
      CXXFLAGS: -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
      VP_CI_BENCH_CACHE_STATE: cold
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: ./.github/actions/clone
      - uses: ./.github/actions/setup-xwin
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: windows-cross
          tools: cargo-nextest
      - name: Check C++ header compatibility
        run: |
          clang --version
          printf '#include <type_traits>\n#include <memory>\n#include <Windows.h>\nint main() { return 0; }\n' > "$RUNNER_TEMP/sdk-smoke.cpp"
          eval "$(cargo xwin env --target x86_64-pc-windows-msvc | grep '^export ')"
          # cargo-xwin emits compiler options as a space-separated string.
          clang $CXXFLAGS_x86_64_pc_windows_msvc -fsyntax-only "$RUNNER_TEMP/sdk-smoke.cpp"
      - name: Check Windows target
        run: |
          eval "$(cargo xwin env --target x86_64-pc-windows-msvc | grep '^export ')"
          unset RUSTFLAGS
          # Fail fast if cargo-xwin ever stops folding the repo's cfg-based
          # Windows rustflags (--cfg tokio_unstable, /STACK:8388608) into the
          # target env var; a dropped /STACK would be a silent runtime
          # difference in the shipped test binaries.
          case "$CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS" in
            *tokio_unstable*STACK:8388608*) ;;
            *)
              echo "::error::cargo-xwin dropped the .cargo/config.toml Windows rustflags: $CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS"
              exit 1
              ;;
          esac
          export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS="$CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS -D warnings"
          cargo check --all-targets --all-features --target x86_64-pc-windows-msvc
      - name: Build test archive
        run: |
          eval "$(cargo xwin env --target x86_64-pc-windows-msvc | grep '^export ')"
          unset RUSTFLAGS
          cargo nextest archive $(for d in crates/*/; do n=$(basename $d); [ "$n" = "vp_cli_snapshots" ] || [ "$n" = "vp_trampoline" ] || echo -n "-p $n "; done) -p vite-plus-cli \
            --target x86_64-pc-windows-msvc --archive-file windows-tests.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-test-archive
          path: windows-tests.tar.zst
          retention-days: 7
  test:
    needs: build
    name: Test (Windows)
    runs-on: namespace-profile-windows-4c-8g
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: ./.github/actions/clone
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-test-archive
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: cargo-nextest
      - name: Run tests
        run: cargo-nextest nextest run -E 'platform(target)' --archive-file windows-tests.tar.zst --workspace-remap . --test-threads 1
        env:
          RUST_MIN_STACK: '8388608'
          __COMPAT_LAYER: RunAsInvoker
          INSTA_WORKSPACE_ROOT: ${{ github.workspace }}
