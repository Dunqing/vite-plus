name: CI scheduling benchmark
run-name: 'Scheduling #2986 / ${{ inputs.variant }} / ${{ inputs.cache_state }} / ${{ inputs.sample }}'
'on':
  workflow_dispatch:
    inputs:
      variant:
        type: choice
        required: true
        options:
          - before
          - after
      cache_state:
        type: choice
        required: true
        options:
          - prime
          - cold
          - warm
      sample:
        type: string
        default: '1'
permissions:
  contents: read
  packages: read
concurrency:
  group: bench-scheduling-2986-r2
  cancel-in-progress: false
jobs:
  before:
    if: inputs.variant == 'before'
    uses: ./.github/workflows/benchmark-before-ci.yml
    with:
      cache_state: ${{ inputs.cache_state }}
  after:
    if: inputs.variant == 'after'
    uses: ./.github/workflows/benchmark-after-ci.yml
    with:
      cache_state: ${{ inputs.cache_state }}
