name: Download CI artifacts as they become available
description: Wait for this workflow's producers, then download their artifacts.

inputs:
  artifact-names:
    description: Artifact names, one per line.
    required: true
  producer-names:
    description: Producer job names, one per line, without a reusable workflow prefix.
    required: true
  path:
    description: Destination directory. Defaults to the workspace.
    required: false
    default: ${{ github.workspace }}

runs:
  using: composite
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      id: artifacts
      env:
        ARTIFACT_NAMES: ${{ inputs.artifact-names }}
        PRODUCER_NAMES: ${{ inputs.producer-names }}
      with:
        retries: 3
        script: |
          const { pathToFileURL } = require('node:url');
          const script = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/wait-for-ci-artifacts.mjs`);
          const { waitForCiArtifacts } = await import(script.href);
          const artifactNames = process.env.ARTIFACT_NAMES.trim().split('\n').filter(Boolean);
          const producerNames = process.env.PRODUCER_NAMES.trim().split('\n').filter(Boolean);
          core.info(`Waiting for ${artifactNames.join(', ')}`);
          const ids = await waitForCiArtifacts({ github, context, artifactNames, producerNames });
          core.setOutput('ids', ids.join(','));

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ steps.artifacts.outputs.ids }}
        path: ${{ inputs.path }}
        merge-multiple: true
