name: Inspect Cargo cache contents
run-name: Inspect existing Cargo caches (read only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inspect:
    name: Inspect ${{ matrix.name }}
    runs-on: namespace-profile-linux-x64-default
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: cli
          key: v0-rust-cli-snapshot-test-x86_64-unknown-linux-gnu-Linux-x64-e2f94ece-6e53ec72
        - name: create
          key: v0-rust-create-e2e-build-Linux-x64-e2f94ece-6e53ec72
        - name: ecosystem
          key: v0-rust-e2e-build-ubuntu-latest-Linux-x64-fed18735-6e53ec72
        - name: test
          key: v0-rust-test-Linux-x64-e2f94ece-6e53ec72
    steps:
    - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
    - name: Resolve cached paths
      id: paths
      shell: bash
      run: "{\n  echo 'paths<<EOF'\n  echo \"$HOME/.cargo/bin\"\n  echo \"$HOME/.cargo/.crates.toml\"\n  echo \"$HOME/.cargo/.crates2.json\"\
        \n  echo \"$HOME/.cargo/registry\"\n  echo \"$HOME/.cargo/git\"\n  echo \"$GITHUB_WORKSPACE/target\"\n  echo 'EOF'\n\
        } >> \"$GITHUB_OUTPUT\""
    - name: Restore existing cache
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.paths.outputs.paths }}
        key: ${{ matrix.key }}
        fail-on-cache-miss: true
    - name: Require exact cache
      run: test '${{ steps.cache.outputs.cache-hit }}' = true
    - name: Inventory restored files
      run: python3 .github/benchmark/cache-inventory.py
      env:
        CACHE_KEY: ${{ matrix.key }}
    - name: Upload inventory
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: cache-inventory-${{ matrix.name }}
        path: ${{ runner.temp }}/cache-inventory.json
        retention-days: 7
