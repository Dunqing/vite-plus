name: Benchmark Rust cache compression

on:
  push:
    branches: [bench/rust-cache-compression]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: windows-tests
            key: v1-rust-windows-cross-Linux-x64-bbaf89fc-a4379c1b
            cache-id: 9227759935
          - runner: namespace-profile-mac-default
            name: mac-cli
            key: v1-rust-cli-snapshot-test-aarch64-apple-darwin-ci-Darwin-arm64-26c55cd9-a4379c1b
            cache-id: 9225128327
          - runner: ubuntu-latest
            name: windows-cli
            key: v1-rust-windows-cli-cross-ci-Linux-x64-0cde8d0c-a4379c1b
            cache-id: 9225255383
          - runner: ubuntu-latest
            name: linux-cli
            key: v1-rust-cli-snapshot-test-x86_64-unknown-linux-gnu-ci-Linux-x64-d090994a-a4379c1b
            cache-id: 9225551422
          - runner: ubuntu-latest
            name: musl-cli
            key: v1-rust-cli-e2e-test-musl-ci-Linux-x64-57bfc019-a4379c1b
            cache-id: 9225427827
          - runner: ubuntu-latest
            name: certless
            key: v1-rust-certless-image-test-Linux-x64-57bfc019-a4379c1b
            cache-id: 9224920375
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: ./.github/actions/clone
      - name: Cache paths
        id: paths
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          cargo = Path.home() / '.cargo'
          paths = [str(cargo / name) for name in ['bin', '.crates.toml', '.crates2.json', 'registry', 'git']]
          paths += [str(Path.cwd() / 'target')]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('paths<<EOF\n' + '\n'.join(paths) + '\nEOF\n')
          PY
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: ${{ steps.paths.outputs.paths }}
          key: ${{ matrix.key }}
          fail-on-cache-miss: true
      - name: Measure identical inputs at compression levels 3 and 9
        shell: bash
        run: python3 .github/benchmark/rust-cache-compression.py
        env:
          BENCH_NAME: ${{ matrix.name }}
          BENCH_CACHE_KEY: ${{ matrix.key }}
          BENCH_CACHE_ID: ${{ matrix.cache-id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cache-compression-${{ matrix.name }}
          path: ${{ runner.temp }}/rust-cache-compression/results.json
          retention-days: 7
