name: CI platform dependency benchmark
run-name: "Platform #3008 / ${{ inputs.variant }} / ${{ inputs.cache_state }} / ${{ inputs.sample }}"
"on":
  workflow_dispatch:
    inputs:
      variant:
        type: choice
        required: true
        options:
          - before
          - after
      cache_state:
        type: choice
        required: true
        options:
          - prime
          - cold
          - warm
      sample:
        type: string
        default: "1"
permissions:
  contents: read
  packages: read
concurrency:
  group: bench-platform-3008-20261015-r1
  cancel-in-progress: false
jobs:
  before:
    if: inputs.variant == 'before'
    uses: ./.github/workflows/benchmark-platform-before.yml
    with:
      cache_state: ${{ inputs.cache_state }}
  after:
    if: inputs.variant == 'after'
    uses: ./.github/workflows/benchmark-platform-after.yml
    with:
      cache_state: ${{ inputs.cache_state }}
