name: Native ThinLTO comparison
run-name: PR 3026 / ${{ inputs.variant }} / ${{ inputs.cache_state }} / ${{ inputs.target }}
'on':
  workflow_dispatch:
    inputs:
      variant:
        type: choice
        required: true
        options:
        - main
        - 'off'
        - thin
      cache_state:
        type: choice
        required: true
        options:
        - cold
        - warm
      target:
        type: choice
        required: true
        options:
        - linux
        - macos
        - windows
        - musl
permissions:
  contents: read
  packages: read
concurrency:
  group: vp-pr3026-r1
  cancel-in-progress: false
jobs:
  main:
    if: inputs.variant == 'main'
    uses: ./.github/workflows/benchmark-native-main.yml
    with:
      cache_state: ${{ inputs.cache_state }}
      target: ${{ inputs.target }}
  'off':
    if: inputs.variant == 'off'
    uses: ./.github/workflows/benchmark-native-off.yml
    with:
      cache_state: ${{ inputs.cache_state }}
      target: ${{ inputs.target }}
  thin:
    if: inputs.variant == 'thin'
    uses: ./.github/workflows/benchmark-native-thin.yml
    with:
      cache_state: ${{ inputs.cache_state }}
      target: ${{ inputs.target }}
