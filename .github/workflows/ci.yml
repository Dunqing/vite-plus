name: PR 3000 standalone cache comparison
run-name: PR 3000 / ${{ inputs.variant }} / ${{ inputs.cache_state }} / pair ${{ inputs.pair }}
'on':
  workflow_dispatch:
    inputs:
      variant:
        type: choice
        options:
        - before
        - after
        required: true
      cache_state:
        type: choice
        options:
        - cold
        - warm
        required: true
      pair:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: pr-3000-standalone-cache-r1
  cancel-in-progress: false
jobs:
  compare:
    name: Linux Rust test job
    runs-on: namespace-profile-linux-x64-default
    timeout-minutes: 45
    env:
      BENCH_VARIANT: ${{ inputs.variant }}
      BENCH_CACHE_STATE: ${{ inputs.cache_state }}
      BENCH_PAIR: ${{ inputs.pair }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/clone
    - name: Record baseline inputs and runner
      run: python3 .github/benchmark/cache-3000/measure.py start
    - name: Restore before Cargo cache
      id: cache-before
      if: inputs.variant == 'before'
      uses: ./.github/benchmark/cache-3000/setup-before
      with:
        tools: just
        save-cache: ${{ inputs.cache_state == 'cold' }}
        cache-key: ${{ format('bench-pr3000-r1-{0}-{1}', inputs.variant, inputs.pair) }}
    - name: Restore after Cargo cache
      id: cache-after
      if: inputs.variant == 'after'
      uses: ./.github/benchmark/cache-3000/setup-after
      with:
        tools: just
        save-cache: ${{ inputs.cache_state == 'cold' }}
        cache-key: ${{ format('bench-pr3000-r1-{0}-{1}', inputs.variant, inputs.pair) }}
    - name: Require intended cache state
      run: python3 .github/benchmark/cache-3000/measure.py restored
      env:
        BENCH_CACHE_HIT: ${{ steps.cache-before.outputs.cache-hit || steps.cache-after.outputs.cache-hit }}
    - name: Measure cargo check
      run: python3 .github/benchmark/cache-3000/measure.py check
    - name: Measure just test
      run: python3 .github/benchmark/cache-3000/measure.py test
    - name: Upload measurements
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: pr-3000-cache-results
        path: ${{ runner.temp }}/cache-3000/
        retention-days: 14
        if-no-files-found: error
