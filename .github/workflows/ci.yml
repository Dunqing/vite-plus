name: Windows test archive cache validation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  packages: read
  actions: read
concurrency:
  group: vp-windows-archive-validation
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  unit_prime:
    name: Unit archive cache prime
    runs-on: namespace-profile-linux-x64-default
    env:
      XWIN_ACCEPT_LICENSE: '1'
      CXXFLAGS: -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: ./.github/actions/clone
      - uses: ./.github/actions/compute-native-cache-input-hash
        id: native-cache-inputs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: test-archive-cache
        with:
          path: windows-tests.tar.zst
          key: vp-archive-validation-${{ github.run_id }}-windows-test-archive-v1-${{ steps.native-cache-inputs.outputs.hash }}-${{ hashFiles('.github/workflows/ci.yml', 'crates/vp_cli_snapshots/**', 'packages/cli/rules/vite-tools.yml') }}
      - name: Require the expected cache result
        run: test "$CACHE_HIT" != true
        env:
          CACHE_HIT: ${{ steps.test-archive-cache.outputs.cache-hit }}
      - uses: ./.github/actions/setup-xwin
        if: steps.test-archive-cache.outputs.cache-hit != 'true'
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: windows-cross
          tools: cargo-nextest
      - name: Build test archive
        if: steps.test-archive-cache.outputs.cache-hit != 'true'
        run: |
          eval "$(cargo xwin env --target x86_64-pc-windows-msvc | grep '^export ')"
          unset RUSTFLAGS
          cargo nextest archive $(for d in crates/*/; do n=$(basename $d); [ "$n" = "vp_cli_snapshots" ] || [ "$n" = "vp_trampoline" ] || echo -n "-p $n "; done) -p vite-plus-cli \
            --target x86_64-pc-windows-msvc --archive-file windows-tests.tar.zst
      - name: Verify archive content
        id: archive-digest
        run: |-
          archive_sha=$(sha256sum "$ARCHIVE" | cut -d " " -f 1)
          echo "sha256=$archive_sha" >> "$GITHUB_OUTPUT"
          if [ -n "$EXPECTED_SHA" ]; then
            test "$archive_sha" = "$EXPECTED_SHA"
          fi
        env:
          ARCHIVE: windows-tests.tar.zst
          EXPECTED_SHA: ''
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prime-windows-test-archive
          path: windows-tests.tar.zst
          retention-days: 7
    outputs:
      sha256: ${{ steps.archive-digest.outputs.sha256 }}
  unit_warm:
    name: Unit archive cache warm
    runs-on: namespace-profile-linux-x64-default
    env:
      XWIN_ACCEPT_LICENSE: '1'
      CXXFLAGS: -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: ./.github/actions/clone
      - uses: ./.github/actions/compute-native-cache-input-hash
        id: native-cache-inputs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: test-archive-cache
        with:
          path: windows-tests.tar.zst
          key: vp-archive-validation-${{ github.run_id }}-windows-test-archive-v1-${{ steps.native-cache-inputs.outputs.hash }}-${{ hashFiles('.github/workflows/ci.yml', 'crates/vp_cli_snapshots/**', 'packages/cli/rules/vite-tools.yml') }}
      - name: Require the expected cache result
        run: test "$CACHE_HIT" = true
        env:
          CACHE_HIT: ${{ steps.test-archive-cache.outputs.cache-hit }}
      - uses: ./.github/actions/setup-xwin
        if: steps.test-archive-cache.outputs.cache-hit != 'true'
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: windows-cross
          tools: cargo-nextest
      - name: Build test archive
        if: steps.test-archive-cache.outputs.cache-hit != 'true'
        run: |
          eval "$(cargo xwin env --target x86_64-pc-windows-msvc | grep '^export ')"
          unset RUSTFLAGS
          cargo nextest archive $(for d in crates/*/; do n=$(basename $d); [ "$n" = "vp_cli_snapshots" ] || [ "$n" = "vp_trampoline" ] || echo -n "-p $n "; done) -p vite-plus-cli \
            --target x86_64-pc-windows-msvc --archive-file windows-tests.tar.zst
      - name: Verify archive content
        id: archive-digest
        run: |-
          archive_sha=$(sha256sum "$ARCHIVE" | cut -d " " -f 1)
          echo "sha256=$archive_sha" >> "$GITHUB_OUTPUT"
          if [ -n "$EXPECTED_SHA" ]; then
            test "$archive_sha" = "$EXPECTED_SHA"
          fi
        env:
          ARCHIVE: windows-tests.tar.zst
          EXPECTED_SHA: ${{ needs.unit_prime.outputs.sha256 }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-test-archive
          path: windows-tests.tar.zst
          retention-days: 7
    needs:
      - unit_prime
    outputs:
      sha256: ${{ steps.archive-digest.outputs.sha256 }}
  snapshot_prime:
    name: Snapshot archive cache prime
    runs-on: namespace-profile-linux-x64-default
    env:
      XWIN_ACCEPT_LICENSE: '1'
      CXXFLAGS: -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: ./.github/actions/clone
      - uses: ./.github/actions/compute-native-cache-input-hash
        id: native-cache-inputs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: test-archive-cache
        with:
          path: windows-snapshot-tests.tar.zst
          key: vp-archive-validation-${{ github.run_id }}-windows-snapshot-test-archive-v1-${{ steps.native-cache-inputs.outputs.hash }}-${{ hashFiles('.github/workflows/ci.yml', 'crates/vp_cli_snapshots/**', 'packages/cli/rules/vite-tools.yml') }}
      - name: Require the expected cache result
        run: test "$CACHE_HIT" != true
        env:
          CACHE_HIT: ${{ steps.test-archive-cache.outputs.cache-hit }}
      - uses: ./.github/actions/setup-xwin
        if: steps.test-archive-cache.outputs.cache-hit != 'true'
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: windows-snapshot-tests
          tools: cargo-nextest
      - name: Build snapshot test archive
        if: steps.test-archive-cache.outputs.cache-hit != 'true'
        run: |
          eval "$(cargo xwin env --target x86_64-pc-windows-msvc | grep '^export ')"
          unset RUSTFLAGS
          cargo nextest archive -p vp_cli_snapshots \
            --target x86_64-pc-windows-msvc --archive-file windows-snapshot-tests.tar.zst
      - name: Verify archive content
        id: archive-digest
        run: |-
          archive_sha=$(sha256sum "$ARCHIVE" | cut -d " " -f 1)
          echo "sha256=$archive_sha" >> "$GITHUB_OUTPUT"
          if [ -n "$EXPECTED_SHA" ]; then
            test "$archive_sha" = "$EXPECTED_SHA"
          fi
        env:
          ARCHIVE: windows-snapshot-tests.tar.zst
          EXPECTED_SHA: ''
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prime-windows-snapshot-test-archive
          path: windows-snapshot-tests.tar.zst
          retention-days: 7
    outputs:
      sha256: ${{ steps.archive-digest.outputs.sha256 }}
  snapshot_warm:
    name: Snapshot archive cache warm
    runs-on: namespace-profile-linux-x64-default
    env:
      XWIN_ACCEPT_LICENSE: '1'
      CXXFLAGS: -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: ./.github/actions/clone
      - uses: ./.github/actions/compute-native-cache-input-hash
        id: native-cache-inputs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: test-archive-cache
        with:
          path: windows-snapshot-tests.tar.zst
          key: vp-archive-validation-${{ github.run_id }}-windows-snapshot-test-archive-v1-${{ steps.native-cache-inputs.outputs.hash }}-${{ hashFiles('.github/workflows/ci.yml', 'crates/vp_cli_snapshots/**', 'packages/cli/rules/vite-tools.yml') }}
      - name: Require the expected cache result
        run: test "$CACHE_HIT" = true
        env:
          CACHE_HIT: ${{ steps.test-archive-cache.outputs.cache-hit }}
      - uses: ./.github/actions/setup-xwin
        if: steps.test-archive-cache.outputs.cache-hit != 'true'
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: windows-snapshot-tests
          tools: cargo-nextest
      - name: Build snapshot test archive
        if: steps.test-archive-cache.outputs.cache-hit != 'true'
        run: |
          eval "$(cargo xwin env --target x86_64-pc-windows-msvc | grep '^export ')"
          unset RUSTFLAGS
          cargo nextest archive -p vp_cli_snapshots \
            --target x86_64-pc-windows-msvc --archive-file windows-snapshot-tests.tar.zst
      - name: Verify archive content
        id: archive-digest
        run: |-
          archive_sha=$(sha256sum "$ARCHIVE" | cut -d " " -f 1)
          echo "sha256=$archive_sha" >> "$GITHUB_OUTPUT"
          if [ -n "$EXPECTED_SHA" ]; then
            test "$archive_sha" = "$EXPECTED_SHA"
          fi
        env:
          ARCHIVE: windows-snapshot-tests.tar.zst
          EXPECTED_SHA: ${{ needs.snapshot_prime.outputs.sha256 }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-snapshot-test-archive
          path: windows-snapshot-tests.tar.zst
          retention-days: 7
    needs:
      - snapshot_prime
    outputs:
      sha256: ${{ steps.archive-digest.outputs.sha256 }}
  download-previous-rolldown-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: ./.github/actions/download-rolldown-binaries
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
  test-windows:
    needs:
      - unit_warm
    name: Test (Windows, shard ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
    runs-on: namespace-profile-windows-4c-8g
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: ./.github/actions/clone
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-test-archive
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: cargo-nextest
      - name: Run tests
        run: cargo-nextest nextest run -E 'platform(target)' --archive-file windows-tests.tar.zst --workspace-remap . --partition hash:${{ matrix.shard }}/3 --test-threads 1
        env:
          RUST_MIN_STACK: '8388608'
          __COMPAT_LAYER: RunAsInvoker
          INSTA_WORKSPACE_ROOT: ${{ github.workspace }}
  cli-snapshot-test-windows:
    name: CLI snapshot test (Windows, shard ${{ matrix.shard }}/6)
    needs:
      - snapshot_warm
      - download-previous-rolldown-binaries
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
    runs-on: namespace-profile-windows-4c-8g
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: ./.github/actions/clone
      - name: Setup Dev Drive
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0
        with:
          drive-size: 12GB
          drive-format: ReFS
          env-mapping: |
            TEMP,{{ DEV_DRIVE }}/Temp
            TMP,{{ DEV_DRIVE }}/Temp
      - name: Create TEMP/TMP on Dev Drive
        shell: bash
        run: mkdir -p "$TEMP" "$TMP"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-snapshot-test-archive
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: cargo-nextest
      - uses: oxc-project/setup-node@1f1a5b4450c8905bd1830c3a908d22b960c4559a
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rolldown-binaries
          path: ./rolldown/packages/rolldown/src
          merge-multiple: true
      - name: Download prebuilt Windows binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-cli-binaries
          run-id: 38199482102
          github-token: ${{ github.token }}
      - name: Install Playwright Chromium
        id: playwright
        background: true
        run: pnpm exec playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
      - name: Build with upstream
        uses: ./.github/actions/build-upstream
        with:
          target: x86_64-pc-windows-msvc
          skip-native: true
      - name: Install Global CLI vp
        shell: bash
        run: pnpm bootstrap-cli:ci
      - name: Prewarm managed runtime
        shell: bash
        run: |
          "$USERPROFILE/.vite-plus/bin/vp.exe" node --version \
            || echo "prewarm failed; cases will download the runtime on demand"
      - name: Create NTFS temp directory for case-sensitive shim snapshots
        if: matrix.shard == 1
        id: snapshot-temp
        shell: pwsh
        run: |
          $volume = [System.IO.Path]::GetPathRoot($env:RUNNER_TEMP)
          $snapshotTemp = Join-Path $volume ('vp-snapshots-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $snapshotTemp | Out-Null
          "directory=$snapshotTemp" >> $env:GITHUB_OUTPUT
      - wait: playwright
      - name: Run PTY snapshot tests
        shell: bash
        run: |
          # current/bin, not bin: on Windows bin\vp.exe is the trampoline,
          # which re-execs %VP_HOME%\current\bin\vp.exe; the runner gives
          # each case an isolated VP_HOME with no install inside, so the
          # trampoline would fail. current\bin\vp.exe is the real CLI.
          export VP_SNAP_GLOBAL_VP="$USERPROFILE/.vite-plus/current/bin/vp.exe"
          export VP_SNAP_JS_RUNTIME_DIR="$USERPROFILE/.vite-plus/js_runtime"
          export VP_SNAP_CMD_BIN="$(cygpath -w "$(command -v cmd.exe)")"
          # Keep pwsh at its canonical installation path; copying pwsh.exe
          # alone can break its adjacent runtime dependencies.
          export VP_SNAP_PWSH_BIN="$(cygpath -w "$(command -v pwsh.exe)")"
          # Reserve all nextest workers for cases that need the execution gate.
          # Generate the overrides from the fixtures, including automatic Ctrl-C
          # isolation, so this configuration cannot drift from the runner.
          VP_SNAP_NEXTEST_CONFIG="$RUNNER_TEMP/snapshot-nextest.toml" \
            cargo-nextest nextest list --archive-file windows-snapshot-tests.tar.zst --workspace-remap . \
            > "$RUNNER_TEMP/snapshot-test-list.txt"
          nextest_run_args=(
            --test-threads 8 --config-file "$RUNNER_TEMP/snapshot-nextest.toml"
            --archive-file windows-snapshot-tests.tar.zst --workspace-remap . --no-fail-fast
          )
          # --no-fail-fast: on a snapshot suite every diff is diagnostic
          # signal; cancelling on the first failure hides the rest.
          test_exit=0
          # This fixture requires case-sensitive directory support, which the
          # default temp directory on these runners does not provide.
          cargo-nextest nextest run "${nextest_run_args[@]}" --partition hash:${{ matrix.shard }}/6 \
            -E 'not test(windows_case_sensitive_shims)' || test_exit=$?

          if [[ '${{ matrix.shard }}' == '1' ]]; then
            # Run both flavors on NTFS once. Rust's GetTempPath2 ignores
            # TEMP/TMP under the SYSTEM account, so override SystemTemp.
            SystemTemp='${{ steps.snapshot-temp.outputs.directory }}' \
              cargo-nextest nextest run "${nextest_run_args[@]}" \
                -E 'test(windows_case_sensitive_shims)' || test_exit=$?

            # Exercise the same environment wrapper under Windows PowerShell 5.1.
            VP_SNAP_PWSH_BIN="$(cygpath -w "$(command -v powershell.exe)")" \
              cargo-nextest nextest run "${nextest_run_args[@]}" \
                -E 'test(command_env_powershell)' || test_exit=$?
          fi
          exit "$test_exit"
        env:
          RUST_BACKTRACE: '1'
          VP_SNAP_PACKAGES_DIR: ${{ runner.temp }}/snapshot-packages
          VP_SNAP_ARTIFACTS_DIR: ${{ runner.temp }}/snapshot-artifacts
          __COMPAT_LAYER: RunAsInvoker
      - name: Upload snapshot diagnostics and timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: snapshot-diagnostics-windows-${{ matrix.shard }}
          path: ${{ runner.temp }}/snapshot-artifacts
          if-no-files-found: ignore
          retention-days: 7
