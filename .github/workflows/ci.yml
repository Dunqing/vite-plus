name: Unix CLI test archive cache validation
'on':
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: vp-unix-cli-cache-validation
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  prime:
    name: Unix CLI archive prime (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: namespace-profile-linux-x64-default
            target: x86_64-unknown-linux-gnu
          - os: namespace-profile-mac-default
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_RELEASE_LTO: 'off'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: ./.github/actions/clone
      - uses: ./.github/actions/compute-native-cache-input-hash
        id: native-cache-inputs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cli-test-cache
        with:
          path: ${{ runner.temp }}/cli-test-binaries.tar.gz
          key: vp-unix-cli-cache-validation-${{ github.run_id }}-cli-test-binaries-v1-${{ matrix.target }}-${{ steps.native-cache-inputs.outputs.hash }}-${{ hashFiles('.github/workflows/ci.yml', 'crates/vp_cli_snapshots/**') }}
      - name: Require expected cache result
        run: test "$CACHE_HIT" != true
        env:
          CACHE_HIT: ${{ steps.cli-test-cache.outputs.cache-hit }}
      - uses: oxc-project/setup-rust@68c3199c5339f965e6e163924c3c450773eba42b
        if: steps.cli-test-cache.outputs.cache-hit != 'true'
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: cli-snapshot-test-${{ matrix.target }}
      - uses: oxc-project/setup-node@1f1a5b4450c8905bd1830c3a908d22b960c4559a
        if: steps.cli-test-cache.outputs.cache-hit != 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: steps.cli-test-cache.outputs.cache-hit != 'true'
        with:
          name: rolldown-binaries
          path: ./rolldown/packages/rolldown/src
          merge-multiple: true
          run-id: 38206828865
          github-token: ${{ github.token }}
      - uses: ./.github/actions/download-cli-test-binaries
        if: steps.cli-test-cache.outputs.cache-hit != 'true'
        with:
          target: ${{ matrix.target }}
      - name: Build with upstream
        if: steps.cli-test-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-upstream
        with:
          target: ${{ matrix.target }}
          skip-native: true
      - name: Ensure no unexpected file changes after build
        if: steps.cli-test-cache.outputs.cache-hit != 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Unexpected file changes detected after build"
            git status
            git diff
            exit 1
          fi
      - name: Build snapshot test binaries
        if: steps.cli-test-cache.outputs.cache-hit != 'true'
        run: cargo test -p vp_cli_snapshots --no-run --message-format=json > "$RUNNER_TEMP/snapshot-test-build.json"
      - name: Package CLI test binaries
        if: steps.cli-test-cache.outputs.cache-hit != 'true'
        run: |
          artifact_dir="$(mktemp -d)"
          trap 'rm -rf "$artifact_dir"' EXIT
          binding_dir="$artifact_dir/packages/cli/binding"
          cli_dir="$artifact_dir/target/$BUILD_TARGET/release"
          snapshot_dir="$artifact_dir/target/snapshot-tests"
          mkdir -p "$binding_dir" "$cli_dir" "$snapshot_dir"

          cp packages/cli/binding/*.node packages/cli/binding/vite-plus.build-time "$binding_dir/"
          cargo metadata --locked --format-version 1 \
            | jq '{packages: [.packages[] | {name, version, source}]}' \
            > "$binding_dir/vite-plus.cargo-metadata.json"
          cp "${CARGO_TARGET_DIR:-target}/$BUILD_TARGET/release/vp" "$cli_dir/"
          for binary in cli_snapshots vpt redact_unit shard_unit registry_pack_unit report_unit schedule_unit; do
            binary_path="$(jq -er --arg name "$binary" \
              'select(.reason == "compiler-artifact" and .target.name == $name and .executable != null) | .executable' \
              "$RUNNER_TEMP/snapshot-test-build.json")"
            cp "$binary_path" "$snapshot_dir/$binary"
          done
          tar -czf "$RUNNER_TEMP/cli-test-binaries.tar.gz" -C "$artifact_dir" .
        env:
          BUILD_TARGET: ${{ matrix.target }}
      - name: Test snapshot runner utilities
        working-directory: crates/vp_cli_snapshots
        run: |
          utility_dir="$(mktemp -d)"
          trap 'rm -rf "$utility_dir"' EXIT
          tar -xzf "$RUNNER_TEMP/cli-test-binaries.tar.gz" -C "$utility_dir" ./target/snapshot-tests
          for binary in "$utility_dir"/target/snapshot-tests/*_unit; do
            "$binary"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prime-cli-test-binaries-${{ matrix.target }}
          path: ${{ runner.temp }}/cli-test-binaries.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Record archive digest
        run: shasum -a 256 "$RUNNER_TEMP/cli-test-binaries.tar.gz"
    permissions:
      contents: read
      packages: read
      actions: read
  warm:
    name: Unix CLI archive warm (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: namespace-profile-linux-x64-default
            target: x86_64-unknown-linux-gnu
          - os: namespace-profile-mac-default
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_RELEASE_LTO: 'off'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: ./.github/actions/clone
      - uses: ./.github/actions/compute-native-cache-input-hash
        id: native-cache-inputs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cli-test-cache
        with:
          path: ${{ runner.temp }}/cli-test-binaries.tar.gz
          key: vp-unix-cli-cache-validation-${{ github.run_id }}-cli-test-binaries-v1-${{ matrix.target }}-${{ steps.native-cache-inputs.outputs.hash }}-${{ hashFiles('.github/workflows/ci.yml', 'crates/vp_cli_snapshots/**') }}
      - name: Require expected cache result
        run: test "$CACHE_HIT" = true
        env:
          CACHE_HIT: ${{ steps.cli-test-cache.outputs.cache-hit }}
      - uses: oxc-project/setup-rust@68c3199c5339f965e6e163924c3c450773eba42b
        if: steps.cli-test-cache.outputs.cache-hit != 'true'
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: cli-snapshot-test-${{ matrix.target }}
      - uses: oxc-project/setup-node@1f1a5b4450c8905bd1830c3a908d22b960c4559a
        if: steps.cli-test-cache.outputs.cache-hit != 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: steps.cli-test-cache.outputs.cache-hit != 'true'
        with:
          name: rolldown-binaries
          path: ./rolldown/packages/rolldown/src
          merge-multiple: true
          run-id: 38206828865
          github-token: ${{ github.token }}
      - uses: ./.github/actions/download-cli-test-binaries
        if: steps.cli-test-cache.outputs.cache-hit != 'true'
        with:
          target: ${{ matrix.target }}
      - name: Build with upstream
        if: steps.cli-test-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-upstream
        with:
          target: ${{ matrix.target }}
          skip-native: true
      - name: Ensure no unexpected file changes after build
        if: steps.cli-test-cache.outputs.cache-hit != 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Unexpected file changes detected after build"
            git status
            git diff
            exit 1
          fi
      - name: Build snapshot test binaries
        if: steps.cli-test-cache.outputs.cache-hit != 'true'
        run: cargo test -p vp_cli_snapshots --no-run --message-format=json > "$RUNNER_TEMP/snapshot-test-build.json"
      - name: Package CLI test binaries
        if: steps.cli-test-cache.outputs.cache-hit != 'true'
        run: |
          artifact_dir="$(mktemp -d)"
          trap 'rm -rf "$artifact_dir"' EXIT
          binding_dir="$artifact_dir/packages/cli/binding"
          cli_dir="$artifact_dir/target/$BUILD_TARGET/release"
          snapshot_dir="$artifact_dir/target/snapshot-tests"
          mkdir -p "$binding_dir" "$cli_dir" "$snapshot_dir"

          cp packages/cli/binding/*.node packages/cli/binding/vite-plus.build-time "$binding_dir/"
          cargo metadata --locked --format-version 1 \
            | jq '{packages: [.packages[] | {name, version, source}]}' \
            > "$binding_dir/vite-plus.cargo-metadata.json"
          cp "${CARGO_TARGET_DIR:-target}/$BUILD_TARGET/release/vp" "$cli_dir/"
          for binary in cli_snapshots vpt redact_unit shard_unit registry_pack_unit report_unit schedule_unit; do
            binary_path="$(jq -er --arg name "$binary" \
              'select(.reason == "compiler-artifact" and .target.name == $name and .executable != null) | .executable' \
              "$RUNNER_TEMP/snapshot-test-build.json")"
            cp "$binary_path" "$snapshot_dir/$binary"
          done
          tar -czf "$RUNNER_TEMP/cli-test-binaries.tar.gz" -C "$artifact_dir" .
        env:
          BUILD_TARGET: ${{ matrix.target }}
      - name: Test snapshot runner utilities
        working-directory: crates/vp_cli_snapshots
        run: |
          utility_dir="$(mktemp -d)"
          trap 'rm -rf "$utility_dir"' EXIT
          tar -xzf "$RUNNER_TEMP/cli-test-binaries.tar.gz" -C "$utility_dir" ./target/snapshot-tests
          for binary in "$utility_dir"/target/snapshot-tests/*_unit; do
            "$binary"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: warm-cli-test-binaries-${{ matrix.target }}
          path: ${{ runner.temp }}/cli-test-binaries.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Record archive digest
        run: shasum -a 256 "$RUNNER_TEMP/cli-test-binaries.tar.gz"
    permissions:
      contents: read
      packages: read
      actions: read
    needs:
      - prime
