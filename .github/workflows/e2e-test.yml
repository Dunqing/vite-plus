name: Combined CI benchmark (e2e)
run-name: Combined e2e / ${{ inputs.variant }} / ${{ inputs.cache_state }}
'on':
  workflow_dispatch:
    inputs:
      variant:
        type: choice
        required: true
        options:
          - before
          - after
      cache_state:
        type: choice
        required: true
        options:
          - prime
          - cold
          - warm
permissions:
  contents: read
  packages: read
concurrency:
  group: vp-ci-scheduling-2986-r1
  cancel-in-progress: false
jobs:
  before:
    if: inputs.variant == 'before'
    uses: ./.github/workflows/benchmark-before-e2e.yml
    with:
      cache_state: ${{ inputs.cache_state }}
  after:
    if: inputs.variant == 'after'
    uses: ./.github/workflows/benchmark-after-e2e.yml
    with:
      cache_state: ${{ inputs.cache_state }}
