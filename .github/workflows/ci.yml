name: Cargo V2 dependency cache validation
'on':
  workflow_dispatch:
    inputs:
      cache_run:
        type: string
        default: ''
        description: Reuse a successful preparation run instead of preparing a new cache.
permissions:
  contents: read
  packages: read
concurrency:
  group: vp-rust-cache-layout-validation
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  prime:
    name: Cargo V2 dependency cache prime
    runs-on: namespace-profile-linux-x64-default
    container:
      image: node:25-alpine3.21
    env:
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      RUSTFLAGS: --cfg tokio_unstable -C link-args=-Wl,--warn-unresolved-symbols -C target-feature=-crt-static
    steps:
    - name: Install Alpine dependencies
      shell: sh {0}
      run: apk add --no-cache bash curl git just musl-dev gcc g++ python3 cmake make tar zstd
    - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
    - name: Record Alpine Node.js runtime
      run: node -p "'ALPINE_NODE=' + process.execPath" >> "$GITHUB_ENV"
    - uses: ./.github/actions/clone
      with:
        setup-node: 'false'
    - name: Verify clone preserves the Alpine Node.js runtime
      run: |
        node -e "require('node:assert/strict').equal(process.execPath, process.env.ALPINE_NODE)"
        node --version
    - name: Install rustup
      run: |
        # GitHub Actions sets HOME=/github/home in containers, but rustup expects euid home (/root)
        export HOME=/root
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
        echo "/root/.cargo/bin" >> "$GITHUB_PATH"
    - name: Install Rust toolchain
      run: rustup show
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        prefix-key: vp-rust-cache-layout-validation-${{ inputs.cache_run || github.run_id }}
        shared-key: test-musl
        save-if: 'true'
      id: cargo-cache
    - name: Check cache state and archive tools
      run: |
        tar --version | head -1 | grep 'GNU tar'
        zstd --version
        test "$CACHE_HIT" != true
      env:
        CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
    - run: just test
    if: inputs.cache_run == ''
  warm:
    name: Cargo V2 dependency cache warm
    runs-on: namespace-profile-linux-x64-default
    container:
      image: node:25-alpine3.21
    env:
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      RUSTFLAGS: --cfg tokio_unstable -C link-args=-Wl,--warn-unresolved-symbols -C target-feature=-crt-static
    steps:
    - name: Install Alpine dependencies
      shell: sh {0}
      run: apk add --no-cache bash curl git just musl-dev gcc g++ python3 cmake make tar zstd
    - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
    - name: Record Alpine Node.js runtime
      run: node -p "'ALPINE_NODE=' + process.execPath" >> "$GITHUB_ENV"
    - uses: ./.github/actions/clone
      with:
        setup-node: 'false'
    - name: Verify clone preserves the Alpine Node.js runtime
      run: |
        node -e "require('node:assert/strict').equal(process.execPath, process.env.ALPINE_NODE)"
        node --version
    - name: Install rustup
      run: |
        # GitHub Actions sets HOME=/github/home in containers, but rustup expects euid home (/root)
        export HOME=/root
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
        echo "/root/.cargo/bin" >> "$GITHUB_PATH"
    - name: Install Rust toolchain
      run: rustup show
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        prefix-key: vp-rust-cache-layout-validation-${{ inputs.cache_run || github.run_id }}
        shared-key: test-musl
        save-if: 'false'
      id: cargo-cache
    - name: Check cache state and archive tools
      run: |
        tar --version | head -1 | grep 'GNU tar'
        zstd --version
        test "$CACHE_HIT" = true
        # Workspace cleanup must preserve the external dependencies.
        rlib_count=$(find target -name '*.rlib' | wc -l)
        echo "Restored dependency libraries: $rlib_count"
        test "$rlib_count" -gt 100
        # Cargo V2 stores each package under its complete name, including hyphens.
        find target/debug/build -mindepth 1 -maxdepth 1 -type d | sort
        test -d target/debug/build/proc-macro2
        test -d target/debug/build/futures-util
      env:
        CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
    - run: just test
    needs:
    - prime
    if: always() && (needs.prime.result == 'success' || inputs.cache_run != '')
